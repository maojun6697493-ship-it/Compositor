name: Chinese build

# An installable arm64 .app for the Simplified Chinese localization.
# No Apple Developer credentials: the app is ad-hoc signed. Sparkle is not in
# this artifact. Hardened runtime rejects a framework whose Team ID differs
# from the app, and an ad-hoc signature has no Team ID, so shipping Sparkle
# crashed at launch. The app is compiled without it and signed once.
on:
  push:
    branches:
      - cursor/localize-zh-hans-452d
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-zh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: arm64 app
    # macOS 27 image. Xcode 26.6's macOS 26.5 SDK binds CocoaError._nsError into
    # libobjc; dyld on macOS 27.0.1 (26A434) aborts because that symbol is gone.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          # 27.0 ships the macOS 27.0 SDK, the release the user's 27.0.1 is on.
          # Later Xcodes on this image ship a newer SDK, so they stay unused.
          if [ -d /Applications/Xcode_27.0.app ]; then
            XCODE=/Applications/Xcode_27.0.app
          elif [ -d /Applications/Xcode_27.app ]; then
            XCODE=/Applications/Xcode_27.app
          else
            echo "Xcode 27.0 is not installed" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release
        run: >
          xcodebuild
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -sdk macosx27.0
          -derivedDataPath DerivedData
          MACOSX_DEPLOYMENT_TARGET=26.0
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          CODE_SIGNING_ALLOWED=YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS=COMPOSITOR_WITHOUT_SPARKLE

      - name: Remove Sparkle and ad-hoc sign
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/Compositor.app"
          EXEC="$APP/Contents/MacOS/Compositor"
          test -d "$APP"
          test -f "$EXEC"
          # The built signature already has the sandbox entitlements, with the
          # bundle id expanded. Capture them before the bundle changes.
          codesign -d --entitlements :- "$APP" > entitlements.plist
          /usr/libexec/PlistBuddy -c "Set :SUEnableAutomaticChecks false" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL https://127.0.0.1/compositor-zh-hans-no-feed" "$APP/Contents/Info.plist"
          rm -rf "$APP/Contents/Frameworks/Sparkle.framework"
          python3 scripts/strip-sparkle-load-command.py "$EXEC"
          if otool -L "$EXEC" | grep -q Sparkle; then
            echo "Sparkle is still linked" >&2
            exit 1
          fi
          # One signature for the whole bundle. --deep left Sparkle on its
          # original team and the app ad-hoc, which dyld rejects.
          codesign --force --sign - --options runtime --entitlements entitlements.plist "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" | grep -q com.apple.security.app-sandbox
          test ! -d "$APP/Contents/Frameworks/Sparkle.framework"
          # minos stays 26.0 so the binary is not pinned to a newer OS than the
          # user's. sdk 27.0 is the SDK that matches macOS 27.0.1.
          BUILD_INFO=$(vtool -show-build "$EXEC")
          echo "$BUILD_INFO"
          echo "$BUILD_INFO" | grep -q "minos 26.0"
          echo "$BUILD_INFO" | grep -q "sdk 27.0"

      - name: Zip
        run: ditto -c -k --keepParent DerivedData/Build/Products/Release/Compositor.app Compositor-zh-Hans.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-zh-Hans
          path: Compositor-zh-Hans.zip
          if-no-files-found: error
          retention-days: 14
